openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /skills:
    get:
      operationId: SkillsController_ListSkills
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillListItemDTO"
      tags:
        - Skills
    post:
      operationId: SkillsController_CreateSkill
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreateInputDTO"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListItemDTO"
      tags:
        - Skills
  /skills/{skill_id}:
    get:
      operationId: SkillsController_GetSkillById
      parameters:
        - name: skill_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillItemByIDOutputDTO"
      tags:
        - Skills
    patch:
      operationId: SkillsController_UpdateSkill
      parameters:
        - name: skill_id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillUpdateInputDTO"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListItemDTO"
      tags:
        - Skills
    delete:
      operationId: SkillsController_DeleteSkill
      parameters:
        - name: :skill_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDeleteOutputDTO"
      tags:
        - Skills
  /skills-group:
    get:
      operationId: SkillsGroupController_ListGroups
      parameters: []
      responses:
        "200":
          description: List available skill groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillGroupItemDTO"
      tags:
        - SkillsGroup
    post:
      operationId: SkillsGroupController_CreateGroup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGroupCreateDto"
      responses:
        "200":
          description: Creates a new skill group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGroupItemDTO"
      tags:
        - SkillsGroup
  /skills-group/{group_id}:
    put:
      operationId: SkillsGroupController_UpdateGroup
      parameters:
        - name: group_id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGroupUpdateDto"
      responses:
        "200":
          description: Updates an skill group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGroupItemDTO"
      tags:
        - SkillsGroup
    delete:
      operationId: SkillsGroupController_deleteGroup
      parameters:
        - name: group_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Deletes an skill group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGroupItemDTO"
      tags:
        - SkillsGroup
  /kanban:
    get:
      operationId: KanbanController_listColumns
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanItemOutputDTO"
      tags:
        - Kanban
    post:
      operationId: KanbanController_createColumn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanCreateInputDTO"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanItemOutputDTO"
      tags:
        - Kanban
  /kanban/{column_id}:
    put:
      operationId: KanbanController_updateColumn
      parameters:
        - name: column_id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanUpdateInputDTO"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                nullable: true
                type: object
                allOf:
                  - $ref: "#/components/schemas/KanbanItemOutputDTO"
      tags:
        - Kanban
    delete:
      operationId: KanbanController_deleteColumn
      parameters:
        - name: column_id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                nullable: true
                type: object
                allOf:
                  - $ref: "#/components/schemas/KanbanItemOutputDTO"
      tags:
        - Kanban
info:
  title: Job Classifier API
  description: Documentação da API
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SkillListItemDTO:
      type: object
      properties:
        createdAt:
          format: date-time
          type: string
          example: &a1 2026-11-11T16:56:12.810Z
        name:
          type: string
          example: Javascript
        rating:
          type: number
          example: 5
        id:
          type: number
        skillsGroup:
          type: object
          example: &a2
            id: 1
            name: Programming language
      required:
        - createdAt
        - name
        - rating
        - id
        - skillsGroup
    SkillItemByIDOutputDTO:
      type: object
      properties:
        annotations:
          type: string
          example: Cool language
        createdAt:
          format: date-time
          type: string
          example: *a1
        name:
          type: string
          example: Javascript
        rating:
          type: number
          example: 5
        id:
          type: number
        skillsGroup:
          type: object
          example: *a2
        jobSkills:
          type: array
          items:
            type: string
        skillsHistories:
          type: array
          items:
            type: string
      required:
        - annotations
        - createdAt
        - name
        - rating
        - id
        - skillsGroup
        - jobSkills
        - skillsHistories
    SkillCreateInputDTO:
      type: object
      properties:
        groupId:
          type: number
        name:
          type: string
          example: Javascript
        rating:
          type: number
          example: 5
        annotations:
          type: string
          example: Cool language
      required:
        - groupId
        - name
        - rating
    SkillUpdateInputDTO:
      type: object
      properties:
        annotations:
          type: string
          example: Cool language
        groupId:
          type: number
        name:
          type: string
          example: Javascript
        rating:
          type: number
          example: 5
    SkillDeleteOutputDTO:
      type: object
      properties:
        createdAt:
          format: date-time
          type: string
          example: *a1
        name:
          type: string
          example: Javascript
        rating:
          type: number
          example: 5
        id:
          type: number
      required:
        - createdAt
        - name
        - rating
        - id
    SkillGroupItemDTO:
      type: object
      properties:
        id:
          type: number
          example: 1
        name:
          type: string
          example: Programming language
        createdAt:
          format: date-time
          type: string
          example: 2026-11-11T16:56:12.810Z
      required:
        - id
        - name
        - createdAt
    SkillGroupCreateDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    SkillGroupUpdateDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    KanbanItemOutputDTO:
      type: object
      properties:
        columnName:
          type: string
        position:
          type: number
        createdAt:
          format: date-time
          type: string
        id:
          type: number
      required:
        - columnName
        - position
        - createdAt
        - id
    KanbanUpdateInputDTO:
      type: object
      properties:
        columnName:
          type: string
        position:
          type: number
    KanbanCreateInputDTO:
      type: object
      properties:
        columnName:
          type: string
        position:
          type: number
      required:
        - columnName
        - position
